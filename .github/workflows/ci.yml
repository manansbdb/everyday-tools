name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock on main is currently out of sync with vite@8 peerOptional esbuild
      # (^0.27||^0.28), so `npm ci` fails. Use `npm install` until the lockfile is repaired.
      - name: Install dependencies
        run: npm install

      - name: Lint, test, and build
        run: npm run lint && npm test && npm run build
